<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pronoun Detectives</title>
<style>
:root{--bg:#fff7e6;--card:#ffffff;--ink:#2b2540;--mute:#6d6785;--acc:#6c4de6;--accink:#ffffff;--ok:#1f9d55;--bad:#d64545;--hl:#ffe08a;--line:#e6dcc3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a2b;--card:#27243b;--ink:#f1eefc;--mute:#a9a3c6;--acc:#9b83ff;--accink:#16132a;--ok:#4cd08a;--bad:#ff7b7b;--hl:#6b5a1c;--line:#3a3657;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1a2b;--card:#27243b;--ink:#f1eefc;--mute:#a9a3c6;--acc:#9b83ff;--accink:#16132a;--ok:#4cd08a;--bad:#ff7b7b;--hl:#6b5a1c;--line:#3a3657;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:18px;line-height:1.45}
.wrap{max-width:680px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:10px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:4px 14px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
h1{margin:0 0 6px;font-size:30px}h2{margin:0 0 8px;font-size:22px}
.big{font-size:64px;text-align:center;margin:4px 0}
.mute{color:var(--mute);font-size:15px}
mark{background:var(--hl);color:inherit;border-radius:6px;padding:0 6px;font-weight:700}
.sent{font-size:22px;margin:8px 0}
.tok{display:inline-block;border:2px dashed var(--line);border-radius:10px;padding:2px 8px;margin:3px;cursor:pointer;background:var(--card);color:var(--ink);font:inherit;font-size:22px}
.tok.ok{background:var(--ok);color:#fff;border-style:solid;border-color:var(--ok)}
.tok.no{animation:sh .3s;border-color:var(--bad)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:14px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer;margin:4px 4px 0 0}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:14px;font:inherit;font-size:22px;font-weight:700;cursor:pointer}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{animation:sh .3s;border-color:var(--bad)}
.fb{min-height:28px;font-weight:700;margin-top:8px;animation:pop .3s}
.nb{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:var(--hl);border-radius:12px;padding:4px 12px;font-weight:700;animation:pop .3s}
.bubble{display:flex;gap:10px;align-items:flex-start}
.av{font-size:42px}
.say{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-size:21px;flex:1}
.blank{display:inline-block;min-width:60px;border-bottom:3px solid var(--acc);text-align:center;font-weight:700;color:var(--acc)}
.stage{display:flex;justify-content:center;align-items:center;gap:12px;font-size:54px;margin:10px 0;min-height:76px}
.stage .t{background:var(--hl);border-radius:16px;padding:2px 14px}
.robo{animation:hop .6s 2}.confused{animation:sh .4s 2}
@keyframes hop{50%{transform:translateY(-16px)}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><span class="pill" id="lv">🕵️ Pronoun Detectives</span><span class="pill" id="stars">⭐ 0</span></div>
<div class="bar"><i id="pg"></i></div>
<div id="app"></div>
</div>
<script>
const $=s=>document.querySelector(s),app=$("#app");
let stars=0,nb=[];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function addStars(n){stars+=n;$("#stars").textContent="⭐ "+stars}
function head(lv,txt,p){$("#lv").textContent=txt;$("#pg").style.width=p+"%"}

function intro(){
head(0,"🕵️ Pronoun Detectives",0);
app.innerHTML=`<div class="card"><div class="big">🕵️‍♀️🔍</div><h1>Pronoun Detectives</h1>
<p>Welcome, detective! There are secret words hiding in English sentences.<br>
<span class="mute">Gizli kelimeleri bul, kuralı kendin keşfet!</span></p>
<p>🔎 Level 1: Find the clues<br>🤖 Level 2: Robo Helper<br>💬 Level 3: Help your friends<br>🗣️ Level 4: Talk with a partner</p>
<button class="btn" onclick="l1(0)">Start the mission</button></div>`}

/* LEVEL 1: discover */
const EX=[
["Mia likes <mark>Tom</mark> very much.","Mia likes him very much.","him","He"],
["Every day, Tom helps <mark>Mia</mark>.","Every day, Tom helps her.","her","She"],
["The kids give <mark>the dog</mark> a bone.","The kids give it a bone.","it","It"],
["Mum takes <mark>Ali and me</mark> to school.","Mum takes us to school.","us","We"],
["Our teacher likes <mark>Ali and Ece</mark>.","Our teacher likes them.","them","They"],
["Mia says: “Tom calls <mark>Mia</mark> every day.”","Mia says: “Tom calls me every day.”","me","I"]];
function l1(i){
head(1,"🔎 Level 1 · Clues",5+i*8);
if(i>=EX.length)return l1rule();
const [a,b,p,s]=EX[i];
const toks=b.split(" ").map(w=>`<button class="tok" data-w="${w.replace(/[.,!?“”:]/g,"")}">${w}</button>`).join("");
app.innerHTML=`<div class="card"><h2>Clue ${i+1} of ${EX.length}</h2>
<p class="mute">Read the two sentences. Which new word replaces the yellow part? Tap it!</p>
<div class="sent">${a}</div><div class="sent">⬇️</div><div id="t">${toks}</div><div class="fb" id="fb"></div>
<div id="nxt"></div></div>
<div class="card"><h2>📒 Detective notebook</h2><div class="nb">${nb.map(x=>`<span class="chip">${x}</span>`).join("")||'<span class="mute">Empty… find your first clue!</span>'}</div></div>`;
document.querySelectorAll(".tok").forEach(t=>t.onclick=()=>{
if(t.dataset.w===p){t.classList.add("ok");$("#fb").textContent="✅ Great! “"+p+"” replaces the yellow words.";
nb.push(s+" → "+p);addStars(1);document.querySelectorAll(".tok").forEach(x=>x.onclick=null);
$("#nxt").innerHTML=`<button class="btn" onclick="l1(${i+1})">Next clue ➜</button>`}
else{t.classList.add("no");$("#fb").textContent="Hmm, try again! 🤔";setTimeout(()=>t.classList.remove("no"),400)}})}

function l1rule(){
head(1,"🔎 Level 1 · Rule",50);
app.innerHTML=`<div class="card"><h2>📒 Look at your notebook</h2><div class="nb">${nb.map(x=>`<span class="chip">${x}</span>`).join("")}</div>
<p class="sent" style="margin-top:14px">Where do <mark>me, him, her, it, us, them</mark> go in the sentences?</p>
<div class="opts" style="grid-template-columns:1fr">
<button class="opt" data-c="0">At the beginning: <i>Him likes Mia.</i></button>
<button class="opt" data-c="1">After the verb: <i>Mia likes him.</i></button>
<button class="opt" data-c="0">Before the verb: <i>Mia him likes.</i></button></div>
<div class="fb" id="fb"></div><div id="nxt"></div></div>`;
document.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
if(o.dataset.c==="1"){o.classList.add("ok");addStars(2);
$("#fb").innerHTML="🎉 You found the rule! <b>Object pronouns</b> come <b>after the verb</b>.<br><span class='mute'>Bonus: “you” is the same → I see <b>you</b>. 😉</span>";
$("#nxt").innerHTML=`<button class="btn" onclick="l2()">Level 2 ➜</button>`}
else{o.classList.add("no");$("#fb").textContent="Check the example sentences again! 🔎"}})}

/* LEVEL 2: match */
const ALL=["me","you","him","her","it","us","them"];
/* [target emoji, target label, speaker emoji, speaker, sentence, fx, answer, result] */
const R=[
["🐶","the dog","👦","Ali","Robo, please wash ___!","🫧","it","Robo washes it! 🫧"],
["👧","Ece","👦","Ali","Robo, please call ___!","📞","her","Robo calls her! 📞"],
["👦👧","Tom and Ece","👩‍🏫","Teacher","Tom and Ece are lost. Robo, please help ___!","🤝","them","Robo helps them! 🤝"],
["👦","Ali himself (he points to his chest 👆)","👦","Ali","Robo, please hug ___!","🤗","me","Ali: “Robo hugs me!” 🤗"],
["👧👦","Ece and Ali (Ece points to both of them 👆)","👧","Ece","Ali and I are tired. Robo, please carry ___!","🎒","us","Ece: “Robo carries us!” 🎒"],
["🤖","Robo","👦","Ali","Robo, you are my best friend. I love ___!","💙","you","Robo: “I love you too!” 💙"],
["👨‍🦳","Mr. Tan","👨","Dad","Mr. Tan is old. Robo, please follow ___ to the market.","🛒","him","Robo follows him! 🛒"]];
let rq=[],ri=0;
function l2(){rq=shuffle(R);ri=0;l2r()}
function l2r(){
head(2,"🤖 Level 2 · Robo Helper",52+ri*3);
if(ri>=rq.length){app.innerHTML=`<div class="card"><div class="big">🤖💙</div><h2>Robo is happy!</h2><p>You gave Robo the right orders. Now help your friends in a real chat.</p><button class="btn" onclick="l3(0)">Level 3 ➜</button></div>`;return}
const [te,tl,se,sn,say,fx,ans,res]=rq[ri];
const opts=shuffle([ans,...shuffle(ALL.filter(x=>x!==ans)).slice(0,3)]);
app.innerHTML=`<div class="card"><h2>Order ${ri+1} of ${rq.length} 🤖</h2>
<p class="mute">Robo does what you say. Who is the target? Choose the right pronoun!</p>
<div class="bubble"><div class="av">${se}</div><div class="say"><b>${sn}:</b><br>${say.replace("___",'<span class="blank" id="bl">?</span>')}</div></div>
<div class="stage"><span id="rb">🤖</span><span id="fx"></span><span class="t">${te}</span></div>
<div class="mute" style="text-align:center">🎯 Target: ${tl}</div>
<div class="opts">${opts.map(x=>`<button class="opt">${x}</button>`).join("")}</div><div class="fb" id="fb"></div></div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
if(b.textContent===ans){b.classList.add("ok");$("#bl").textContent=ans;$("#fx").textContent=fx;$("#rb").classList.add("robo");addStars(2);$("#fb").textContent="✅ "+res;
document.querySelectorAll(".opt").forEach(x=>x.onclick=null);ri++;setTimeout(l2r,1700)}
else{b.classList.add("no");const r=$("#rb");r.textContent="🤖💥";r.classList.add("confused");$("#fb").textContent="Oops! Robo is confused. Look at the target again! 🎯";setTimeout(()=>{r.textContent="🤖";r.classList.remove("confused")},900)}})}

/* LEVEL 3: communicative chat */
const C=[
["👧","Ece","Where is Tom? I can’t find ___.","him","🔍"],
["👦","Ali","My little sister is sad. Can you help ___?","her","😢"],
["👩","Mum","Ali and I are outside. Please open the door for ___.","us","🚪"],
["👩‍🏫","Teacher","Here is your homework. Please read ___ now.","it","📘"],
["👦","Ali","The kids are very loud! I can’t hear ___.","them","📢"],
["👧","Ece","I am lost! Please help ___!","me","🗺️"]];
function l3(i){
head(3,"💬 Level 3 · Chat",70+i*4);
if(i>=C.length){app.innerHTML=`<div class="card"><div class="big">💬🌟</div><h2>Your friends say thanks!</h2><p>Now let’s speak English for real.</p><button class="btn" onclick="l4(0)">Level 4 ➜</button></div>`;return}
const [av,who,txt,ans,pic]=C[i];
const opts=shuffle([ans,...shuffle(ALL.filter(x=>x!==ans)).slice(0,3)]);
app.innerHTML=`<div class="card"><h2>Message ${i+1} of ${C.length} ${pic}</h2>
<div class="bubble"><div class="av">${av}</div><div class="say"><b>${who}:</b><br>${txt.replace("___",'<span class="blank" id="bl">?</span>')}</div></div>
<p class="mute">Choose the best pronoun to reply:</p>
<div class="opts">${opts.map(x=>`<button class="opt">${x}</button>`).join("")}</div><div class="fb" id="fb"></div></div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
if(b.textContent===ans){b.classList.add("ok");$("#bl").textContent=ans;addStars(2);$("#fb").textContent="✅ "+who+": “Thank you!”";
document.querySelectorAll(".opt").forEach(x=>x.onclick=null);setTimeout(()=>l3(i+1),1200)}
else{b.classList.add("no");$("#fb").textContent="Think about who or what it is. 🤔"}})}

/* LEVEL 4: speak with a partner */
const S=[
["🍕","Do you like pizza?","Yes, I like <mark>it</mark>."],
["🐱","Do you like cats?","Yes, I like <mark>them</mark>."],
["👩‍🏫","Do you like your English teacher?","Yes, I like <mark>her</mark>. / Yes, I like <mark>him</mark>."],
["🎒","Who helps you with your homework?","My mum helps <mark>me</mark>."],
["⚽","Do you play football with your friends?","Yes, I play with <mark>them</mark>."],
["👨‍👩‍👧","Do you visit your grandparents?","Yes, we visit <mark>them</mark>. They love <mark>us</mark>!"]];
function l4(i){
head(4,"🗣️ Level 4 · Speak",90+i*1.5);
if(i>=S.length)return end();
const [e,q,a]=S[i];
app.innerHTML=`<div class="card"><h2>Speaking card ${i+1} of ${S.length}</h2><div class="big">${e}</div>
<p class="sent"><b>Partner A:</b> ${q}</p>
<p class="mute">Partner B, answer with an object pronoun! Need help?</p>
<div id="hint"><button class="btn alt" onclick="document.getElementById('hint').innerHTML='<p class=sent>${a.replace(/'/g,"&#39;").replace(/"/g,"&quot;")}</p>'">💡 Show a sample answer</button></div>
<button class="btn" onclick="addStars(3);l4(${i+1})">We spoke! ⭐⭐⭐</button></div>
<p class="mute">Swap roles on the next card.</p>`}

function end(){
head(5,"🏆 Mission complete",100);
const r=stars>=40?"Super Detective 🥇":stars>=28?"Great Detective 🥈":"Junior Detective 🥉";
app.innerHTML=`<div class="card"><div class="big">🏆</div><h1>Mission complete!</h1>
<p class="sent">You are a <mark>${r}</mark></p><p>You collected <b>${stars} stars</b>.</p>
<p><b>Remember:</b><br>I → <b>me</b> · you → <b>you</b> · he → <b>him</b> · she → <b>her</b><br>it → <b>it</b> · we → <b>us</b> · they → <b>them</b></p>
<p class="mute">Object pronouns come after the verb.</p>
<button class="btn" onclick="stars=0;nb=[];addStars(0);intro()">Play again 🔄</button></div>`}
intro();
</script>
</body>
</html>
